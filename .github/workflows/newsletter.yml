# Weekly newsletter — every Friday evening, builds Saturday's "Cap sur l'espace"
# (FR + EN) with the website's own code, creates both campaigns in Brevo, sends a
# test copy to NEWSLETTER_EMAIL, and SCHEDULES them for Saturday 09:00 French time
# (with a note telling you so — unschedule in Brevo before then to stop it).
# Manual runs (Actions tab → Weekly newsletter → Run workflow) never schedule:
# "preview" only builds the emails, "draft" also creates drafts + a test copy.

name: Weekly newsletter

on:
  schedule:
    # Fridays 19:17 UTC = 20:17 (winter) / 21:17 (summer) in France. GitHub often starts
    # scheduled jobs late (hours, at busy times), so this leaves a wide margin before 09:00.
    - cron: "17 19 * * 5"
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = only build the emails · draft = also create the drafts in Brevo and send you a test copy"
        type: choice
        options: [preview, draft]
        default: preview

permissions:
  contents: write         # only to commit newsletter/last-run.json once a month (keep-alive)

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the newsletter (and create / schedule the Brevo campaigns)
        run: node newsletter/send.js
        env:
          NL_MODE: ${{ github.event_name == 'schedule' && 'auto' || inputs.mode }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          NEWSLETTER_EMAIL: ${{ secrets.NEWSLETTER_EMAIL }}

      - name: Keep the emails (downloadable from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter-${{ github.run_number }}
          path: newsletter/out/
          if-no-files-found: ignore
          retention-days: 30

      # GitHub pauses scheduled jobs after 60 days without any change to the repo.
      # On the first Friday of each month, record the last run so that never happens.
      - name: Keep the weekly schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%-d)" -le 7 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add newsletter/last-run.json
            git commit -m "newsletter: monthly keep-alive" || true
            git push || true
          fi
